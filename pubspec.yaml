name: iptv_player
description: Player IPTV multipiattaforma con interfaccia scura e accento rosso.
publish_to: "none"
version: 0.7.1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  window_manager: ^0.4.3
  open_filex: ^4.5.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  device_info_plus: ^10.1.0

flutter:
  uses-material-design: true
